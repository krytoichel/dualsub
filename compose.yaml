services:
  app:
    build: .
    container_name: dualsub-app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: dualsub-db
    environment:
      POSTGRES_DB: dualsub
      POSTGRES_USER: dualsub
      POSTGRES_PASSWORD: dualsub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dualsub -d dualsub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: